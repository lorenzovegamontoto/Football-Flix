name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create gradlew script
      run: |
        cat > gradlew << 'GRADLEW'
        #!/bin/sh
        GRADLE_WRAPPER_JAR=gradle/wrapper/gradle-wrapper.jar
        if [ ! -f "$GRADLE_WRAPPER_JAR" ]; then
          mkdir -p gradle/wrapper
          curl -L -o "$GRADLE_WRAPPER_JAR" https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
        fi
        exec java -jar "$GRADLE_WRAPPER_JAR" "$@"
        GRADLEW
        chmod +x gradlew
    
    - name: Create Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.4-bin.zip && unzip -j gradle-8.4-bin.zip gradle-8.4/lib/gradle-launcher-8.4.jar -d gradle/wrapper/ && mv gradle/wrapper/gradle-launcher-8.4.jar gradle/wrapper/gradle-wrapper.jar || true
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
    
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: football-classics-debug
        path: app/build/outputs/apk/debug/*.apk
